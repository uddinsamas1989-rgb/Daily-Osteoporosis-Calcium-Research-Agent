name: Daily Medical Research Digest Pipeline

on:
  schedule:
    # Trigger at 10:25 UTC every day (which equals 16:25 BST / UTC+6)
    - cron: '25 10 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to ensure seamless Git commits back to main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py

      - name: Commit and Push Updated Sent History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add sent_history.json
          
          # Check if there are changes staged for commit
          if git diff --staged --quiet; then
            echo "No updates to sent_history.json to commit."
          else
            git commit -m "chore: update sent_history.json with newly processed PMIDs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
